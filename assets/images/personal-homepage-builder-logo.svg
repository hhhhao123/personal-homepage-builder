      <stop offset="1" stop-color="#E95D3C"/>
    </linearGradient>
    <filter id="shadow" x="205" y="61" width="1030" height="398" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
