<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal Homepage Builder</title>
  <desc id="desc">A logo showing a personal homepage card being assembled from identity, content, style, and publishing signals.</desc>
  <defs>
