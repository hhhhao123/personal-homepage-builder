interface:
  display_name: "Personal Homepage Builder"
  short_description: "Guide beginners from identity to personal homepage."
  default_prompt: "Use $personal-homepage-builder. I want to build or improve a personal github.io homepage, but I may not know what information, style, structure, or materials I need. Guide me step by step with simple choices or rough non-code sketches when useful, tell me what to prepare as we go, and do not write code until we have a confirmed homepage plan."

policy:
  allow_implicit_invocation: true
